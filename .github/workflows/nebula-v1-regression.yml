name: NEBULA V1 regression
on:
  pull_request:
  push:
    branches:
      - fix/nebula-api-auth-hardening-20261027
      - main
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore full API source
        run: node scripts/restore-nebula-api.mjs
      - name: Syntax check
        run: |
          node --check workers/nebula-api/worker.mjs
          node --check workers/nebula-scanner/worker.mjs
      - name: Bundle scanner for staging
        run: |
          node scripts/bundle-nebula-scanner.mjs
          node --check dist/nebula-scanner.mjs
      - name: Regression tests
        run: node --test tests/*.test.mjs backend/tests/*.test.mjs
